server {
    server_name orbisojas.com www.orbisojas.com;
    root /var/www/orbisojas;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Redirects for renamed paths (SEO)
    rewrite ^/template(/.*)?$ / permanent;
    rewrite ^/her(/.*)?$ / permanent;
    rewrite ^/his(/.*)?$ / permanent;

    rewrite ^/boytoman(/.*)?$ / permanent;
    rewrite ^/girltowomen(/.*)?$ / permanent;
    rewrite ^/home/?$ / permanent;
    rewrite ^/begin(.html)?$ /soul-mirror permanent;
    rewrite ^/soulmirror(/.*)?$ /soul-mirror permanent;

    # Serve the exported 404 page.
    error_page 404 /404.html;

    # Next's router prefetches RSC payloads using dots where the static
    # export writes directory separators:
    #   requested  /atlas/__next.atlas.__PAGE__.txt
    #   on disk    /atlas/__next.atlas/__PAGE__.txt
    # Without these two rewrites every prefetch 404s — navigation still
    # works, but it falls back to a full page load and floods the console.
    # The dots MUST be escaped. Unescaped, `.` matches `/` too, so the rule
    # also matches the already-rewritten path and nginx loops on itself.
    rewrite "^(.*)/__next\.([^/.]+)\.([^/.]+)\.__PAGE__\.txt$" "$1/__next.$2/$3/__PAGE__.txt" last;
    rewrite "^(.*)/__next\.([^/.]+)\.__PAGE__\.txt$" "$1/__next.$2/__PAGE__.txt" last;

    # The exported OG card has no file extension, so nginx would otherwise
    # serve it as application/octet-stream and every social platform would
    # refuse to render it.
    location = /opengraph-image {
        default_type image/png;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/orbisojas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbisojas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.orbisojas.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = orbisojas.com) {
        return 301 https://$host$request_uri;
    }
    server_name orbisojas.com www.orbisojas.com;
    listen 80;
    return 404;
}
